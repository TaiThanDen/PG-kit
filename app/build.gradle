plugins {
    id "com.android.application"
}

android {
    namespace "com.pgkit.timemarkcamera"
    compileSdk 35

    defaultConfig {
        applicationId "com.pgkit.timemarkcamera"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.0-beta.1"
    }

    signingConfigs {
        release {
            if (System.getenv("TIMECOUNTER_KEYSTORE")) {
                storeFile file(System.getenv("TIMECOUNTER_KEYSTORE"))
                storePassword System.getenv("TIMECOUNTER_STORE_PASSWORD")
                keyAlias System.getenv("TIMECOUNTER_KEY_ALIAS")
                keyPassword System.getenv("TIMECOUNTER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    implementation "androidx.camera:camera-video:1.4.1"
    implementation "androidx.camera:camera-effects:1.4.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
}
